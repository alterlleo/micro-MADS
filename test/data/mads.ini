#######################################################################
# TESI
##################################################################### 
# [mqtt2mads]
# broker_host = "localhost"
# broker_port = 1883
# topic = "#"
# QoS = 2
# silent = false

[edge_parser]
broker_host = "127.0.0.1"
broker_port = 1883
silent = false
QoS = 2
topic = "#"
pub_topic = "edge"
# state = ["Xdes", "Ydes", "Zdes", "Xenc", "Yenc", "Zenc"]
state = ["X", "Y", "Z", "SP", "A", "C"]
filter = true
wire_format = "msgpack"

[rerunner]
queue_size = 1
sub_topic = ["edge", "sensors"]
keypaths = ["edge/X", "edge/Y", "edge/Z", "edge/SP", "edge/A", "edge/C", "sensors/mq135"]
# keypaths = ["edge/Xdes", "edge/Ydes", "edge/Zdes", "edge/Xenc", "edge/Yenc", "edge/Zenc", "edge/state"]

############################################################################
# DEDALUS
############################################################################
[spi_agent]
sub_topic = "setpoint"
pub_topic = "machine"

[CNCagent]
sub_topic = ["fmu", "machine"]
pub_topic = "setpoint"
sim = true
wire_format = "msgpack"

[fmu_multibody_model]
period = 100
pub_topic = "fmu"
sub_topic = ["setpoint"]
relative_tol = 1e-4
absolute_tol = 1e-5

[fmu_multibody_model.parameters]
# default values from FMU
Dc = 1e-06
Dpy = 1e-06
Dvx = 1e-06
Dvy = 1e-04
Dz = 1e-06
Ic = 1e-06
Ipy = 1e-04
Ivx = 1e-03
Ivy = 1e-03
Iz = 1e-06
Npy = 65
Nvx = 65
Nvy = 10
Nz = 65
Ppy = 100
Pvx = 300
Pvy = 10.0
Pz = 300
Dpx = 1e-06
Ipx = 1e-04
Npx = 65
Ppx = 300
Na = 10
Pa = 10
Ia = 1e-6
Da = 1e-6

# [rerunner]
# sub_topic = ["fmu"]
# keypaths = ["fmu/input/x", "fmu/input/y", "fmu/input/z", "fmu/output/position/0", "fmu/output/position/1", "fmu/output/position/2", "fmu/output/position/3", "fmu/output/position/4", "fmu/input/a", "fmu/input/c", "fmu/input/vx", "fmu/input/vy"]
# queue_size = 1
# trace_keypaths = ["estimated/pos"]

[machinetool]
queue_size = 1
sub_topic = ["fmu"]
initial_position = [0, 0, 40, 0, 0]
tool = {length = 10, diameter = 2, z_offset = 150}

[fmu_signal_based_model]
period = 100
pub_topic = "fmu_signal_based_model"
sub_topic = ["signal_based_model_control"]
relative_tol = 1e-4
absolute_tol = 1e-5
hmin_tol = 1e-10

[rem]
sub_topic = "machine"
pub_topic = "setpoint"

[tuner_plugin]
pub_topic = "setpoint"
sub_topic = "machine"
queue_size = 1

[stm32_board]
pub_topic = "micro"
sub_topic = "test"
