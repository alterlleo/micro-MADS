[echoj]
# Topic to publish to (single string!)
pub_topic = "echoj"
sub_topic = ["rfid"]


[clock]
# Topic to publish to (single string!)
pub_topic = "clock"
period = 200


######################################################
# SENSOR FUSION
#####################################################
[pos_estimator]
sub_topic = ["replay_encoders", "replay_imu", "replay_htc", "replay_realsense"]
pub_topic = "estimated"
dev = true
Rr = 0.08726
Rl = 0.08582
b = 0.86

##########################################################
# LUFTMETER
#######################################################

[luftmeter]
pub_topic = "sensors"
period = 500
activate_channels = "0101"

[luftmeter_rerunner]
sub_topic = ["sensors"]
keypaths = ["sensors/rh", "sensors/temp", "sensors/voc_0", "sensors/voc_1","sensors/pres_0", "sensors/pres_1"]
# sub_topic = ["estimated"]
# keypaths = ["estimated/pos/0", "estimated/pos/1", "estimated/theta"]
# trace_keypaths = ["estimated/pos"]

